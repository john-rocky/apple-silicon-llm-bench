<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 444" width="860" height="444" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Gemma 4 E2B on an iPhone 17 Pro, one row per build</title>
<desc id="d">Gemma 4 E2B on an iPhone 17 Pro, one row per build, grouped by capture session. Session 7/20, Cactus, CQ4 uncalibrated: 50.6 tok/s cold, 1,061 MB peak, GSM8K 87%. Session 7/27, llama.cpp, Q4_K_M: 38.8 tok/s, 191 MB mmap, GSM8K 76%. Session 7/28, LiteRT-LM, wNa8o8 QAT: 61.1 tok/s, 497 MB, GSM8K 86%. Session 7/28, MLX Swift, PTQ 4-bit: 49.1 tok/s, 3,010 MB, GSM8K 84%. Session 7/28, MLX Swift, QAT OptiQ int4: 36.0 tok/s, 4,592 MB, GSM8K 91%. Session 7/29, Cactus, CQ4 as shipped: 50.0 tok/s, 632 MB, GSM8K 3%. Session 7/29, Core AI, own int4, patched engine: 47.1 tok/s, 755 MB mmap, GSM8K 88%.</desc>
<text x="0" y="28" font-size="20" font-weight="600" fill="#f0efec">Gemma 4 E2B on an iPhone 17 Pro, one row per build</text>
<text x="0" y="52" font-size="14" font-weight="400" fill="#c3c2b7">Rows are grouped by capture session, July 2026 on iOS 27. Compare decode and memory only within one group.</text>
<text x="0" y="72" font-size="14" font-weight="400" fill="#c3c2b7">GSM8K: n=100, measured on an M4 Max with one harness. LiteRT-LM had a 2,048-token limit, the others 1,024.</text>
<text x="0" y="92" font-size="14" font-weight="400" fill="#c3c2b7">Higher decode and GSM8K are better, lower memory is better.</text>
